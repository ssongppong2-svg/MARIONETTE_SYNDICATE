<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nudge 태초의 문</title>
  <meta name="description" content="밀 때 40 N, 당길 때 60 N뿐인 약한 마우스 포인터가 중력과 마찰력을 빌려 벽을 부수고 열쇠 조각을 모으는 물리 퍼즐 세계.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Gowun+Dodum&family=Jua&display=swap">
  <style>
    /* Layout: one full-bleed canvas world; soft paper cards float over it for start and pause. */
    :root {
      --sky: #f6eefa;
      --ink: #4e4270;
      --ink-soft: #7d6fa6;
      --card: rgba(255, 255, 255, 0.93);
      --line: #cbbff1;
      --accent: #f39fbf;
      --accent-edge: #e48aae;
      --focus: #7c6cc4;
      --scrim: rgba(78, 66, 112, 0.2);
      --f-title: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      --f-text: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      --f-num: "Fredoka", "Jua", ui-rounded, system-ui, sans-serif;
      color-scheme: light;
    }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--sky); color: var(--ink); }
    #world { display: block; width: 100%; height: 100%; touch-action: none; cursor: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); cursor: default; }
    .card { box-sizing: border-box; width: 100%; max-width: 440px; max-height: calc(100% - 8px); overflow: auto; display: grid; gap: 14px; padding: 28px 24px 24px; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 26px; box-shadow: 0 14px 44px rgba(124, 108, 196, 0.25); }
    h1 { margin: 0; font: 400 clamp(44px, 11vw, 64px)/1 var(--f-title); letter-spacing: 0.01em; color: var(--ink); text-wrap: balance; }
    h1 small { display: block; margin-top: 8px; font-size: 0.42em; color: var(--ink-soft); }
    h2 { margin: 0; font: 400 32px/1.1 var(--f-title); color: var(--ink); }
    p { margin: 0; font: 400 15px/1.65 var(--f-text); color: var(--ink); text-wrap: pretty; }
    .stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .stat { display: grid; gap: 2px; min-width: 92px; padding: 10px 12px; border-radius: 16px; background: #fbf8ff; border: 1px solid #e6defa; }
    .stat b { font: 600 22px/1 var(--f-num); color: var(--ink); font-variant-numeric: tabular-nums; }
    .stat span { font: 400 12px/1.3 var(--f-text); color: var(--ink-soft); }
    .note { font-size: 13px; color: var(--ink-soft); }
    .buttons { display: grid; gap: 10px; }
    button { font: 400 16px/1.2 var(--f-text); padding: 12px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: #ffffff; color: var(--ink); cursor: pointer; transition: transform 0.12s ease, background 0.12s ease; }
    button:hover { background: #faf6ff; transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    button.primary { font: 400 22px/1.1 var(--f-title); background: var(--accent); border-color: var(--accent-edge); color: #ffffff; padding: 14px 18px; }
    button.primary:hover { background: #f08fb4; }
    .touch { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: flex-end; }
    .touch button { padding: 10px 14px; font-size: 14px; background: rgba(255, 255, 255, 0.85); }
    .touch .grab { width: 84px; height: 84px; padding: 0; border-radius: 50%; font: 400 20px/1 var(--f-title); background: rgba(255, 255, 255, 0.9); border: 2px solid var(--accent-edge); color: var(--ink); touch-action: none; }
    .touch .grab:active { background: var(--accent); color: #ffffff; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } button:hover, button:active { transform: none; } }
  </style>
</head>
<body>
  <canvas id="world" aria-label="포인터가 힘을 빌려 벽을 부수는 파스텔 물리 세계"></canvas>

  <div id="start" class="overlay">
    <section class="card" aria-labelledby="start-title">
      <h1 id="start-title">Nudge<small>태초의 문</small></h1>
      <p>너는 마우스 포인터다. 밀 수 있는 힘도, 당길 수 있는 줄도 아주 약하다. 세상의 힘을 빌려 벽을 부수고 열쇠 조각을 모아라.</p>
      <div class="stats">
        <div class="stat"><b>40 N</b><span>미는 힘</span></div>
        <div class="stat"><b>60 N</b><span>잡은 줄의 힘</span></div>
        <div class="stat"><b>60 N</b><span>버틸 수 있는 충격</span></div>
      </div>
      <div class="buttons"><button id="start-btn" class="primary" type="button">시작하기</button></div>
      <p id="start-note" class="note">시작하면 마우스가 화면에 잠깁니다. Esc를 누르면 일시정지됩니다.</p>
    </section>
  </div>

  <div id="pause" class="overlay" hidden>
    <section class="card" aria-labelledby="pause-title">
      <h2 id="pause-title">일시정지</h2>
      <div class="buttons">
        <button id="resume-btn" class="primary" type="button">계속하기</button>
        <button id="reset-btn" type="button">이 구역 처음부터</button>
        <button id="mute-btn" type="button" aria-pressed="false">소리 끄기 (M)</button>
        <button id="new-btn" type="button">처음부터 새로 하기</button>
      </div>
      <p class="note">찾은 조각과 부활 지점은 이 브라우저에 저장됩니다.</p>
    </section>
  </div>

  <div id="touch" class="touch" hidden>
    <button id="tpause-btn" type="button">일시정지</button>
    <button id="treset-btn" type="button">다시</button>
    <button id="grab-btn" class="grab" type="button">잡기</button>
  </div>

  <script src="src/core/math.js"></script>
  <script src="src/core/geometry.js"></script>
  <script src="src/physics/body.js"></script>
  <script src="src/physics/collide.js"></script>
  <script src="src/physics/contact.js"></script>
  <script src="src/physics/joints.js"></script>
  <script src="src/physics/world.js"></script>
  <script src="src/nudge/kit.js"></script>
  <script src="src/nudge/pointer.js"></script>
  <script src="src/nudge/monsters.js"></script>
  <script src="src/nudge/game.js"></script>
  <script src="src/nudge/regions/hub.js"></script>
  <script src="src/nudge/regions/gravity.js"></script>
  <script src="src/nudge/regions/friction.js"></script>
  <script src="src/nudge/view.js"></script>
  <script src="src/nudge/hud.js"></script>
  <script src="src/nudge/input.js"></script>
  <script src="src/nudge/audio.js"></script>
  <script src="src/nudge/main.js"></script>
</body>
</html>
